<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>espotifai</title>
    <!-- Base styles -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utils.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <!-- View styles -->
    <link rel="stylesheet" href="views/search/search.css" />
    <link rel="stylesheet" href="views/library/library.css" />
    <link rel="stylesheet" href="views/import/import.css" />
    <link rel="stylesheet" href="views/stats/stats.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- SIDEBAR -->
      <aside class="sidebar" role="navigation" aria-label="Navegacion principal">
        <div class="sidebar__top">
          <a href="#" class="logo" data-nav="search">espotif<span class="logo__accent">ai</span></a>
        </div>
        <nav class="sidebar__nav">
          <a class="nav-item active" href="#" data-nav="search" aria-label="Buscar">
            <svg
              class="nav-item__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Buscar
          </a>
          <a class="nav-item" href="#" data-nav="library" aria-label="Biblioteca">
            <svg
              class="nav-item__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
            Mi Biblioteca
            <span class="nav-item__badge" id="libCount">0</span>
          </a>
          <div class="sidebar__section">
            <p class="sidebar__section-label">Explorar</p>
            <a class="nav-item" href="#" data-nav="import" aria-label="Importar URL">
              <svg
                class="nav-item__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
              Importar URL
            </a>
            <a class="nav-item" href="#" data-nav="stats" aria-label="Estadisticas">
              <svg
                class="nav-item__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
              </svg>
              Estadisticas
            </a>
          </div>
        </nav>
      </aside>

      <!-- MAIN AREA -->
      <div class="main-area">
        <div class="topbar" id="topbar">
          <div class="topbar__left">
            <h1 class="topbar__title" id="topbarTitle">Buscar</h1>
          </div>
          <div class="topbar__right">
            <button
              class="theme-toggle"
              id="themeToggle"
              title="Cambiar tema"
              aria-label="Cambiar tema"
            >
              <svg
                id="iconSun"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
              <svg
                id="iconMoon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="display: none"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
            <div class="avatar avatar--topbar" id="avatarBtn" title="Mi perfil">U</div>
          </div>
        </div>
        <!-- Views: each loaded from views/*/*.html via JS -->
        <div class="view-pane" id="viewPaneContainer">
          <div id="view-search"></div>
          <div id="view-library" class="hidden"></div>
          <div id="view-import" class="hidden"></div>
          <div id="view-stats" class="hidden"></div>
        </div>
      </div>
      <!-- /main-area -->

      <!-- PLAYER -->
      <div class="player" id="player" role="region" aria-label="Reproductor de musica">
        <div class="player__track">
          <img class="player__thumb" id="playerThumb" src="" alt="" />
          <div class="player__meta">
            <p class="player__title" id="playerTitle">Sin pista</p>
            <p class="player__author" id="playerAuthor"></p>
          </div>
        </div>
        <div class="player__controls">
          <div class="player__btns">
            <button
              class="player__btn player__btn--mode"
              id="playerShuffle"
              aria-label="Aleatorio"
              title="Aleatorio"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="16 3 21 3 21 8" />
                <line x1="4" y1="20" x2="21" y2="3" />
                <polyline points="21 16 21 21 16 21" />
                <line x1="15" y1="15" x2="21" y2="21" />
              </svg>
            </button>
            <button class="player__btn" id="playerPrev" aria-label="Anterior">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="19 20 9 12 19 4 19 20" />
                <line
                  x1="5"
                  y1="19"
                  x2="5"
                  y2="5"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                />
              </svg>
            </button>
            <button class="player__btn player__btn--play" id="playerPlay" aria-label="Reproducir">
              <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              <svg
                id="iconPause"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="display: none"
              >
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
              </svg>
            </button>
            <button class="player__btn" id="playerNext" aria-label="Siguiente">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line
                  x1="19"
                  y1="5"
                  x2="19"
                  y2="19"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                />
              </svg>
            </button>
            <button
              class="player__btn player__btn--mode"
              id="playerRepeat"
              aria-label="Repetir"
              title="Repetir"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="17 1 21 5 17 9" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <polyline points="7 23 3 19 7 15" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
              </svg>
            </button>
          </div>
          <div class="player__progress">
            <span class="player__time" id="playerCurrent">0:00</span>
            <input
              class="player__seek"
              id="playerSeek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Progreso"
            />
            <span class="player__time player__time--end" id="playerDuration">0:00</span>
          </div>
        </div>
        <div class="player__right">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input
            class="player__vol"
            id="playerVol"
            type="range"
            min="0"
            max="1"
            step="0.02"
            value="1"
            aria-label="Volumen"
          />
        </div>
        <audio id="audioEl" preload="metadata"></audio>
      </div>
    </div>
    <!-- /app-shell -->

    <!-- EXPANDED PLAYER -->
    <div class="player-exp" id="playerExp" aria-label="Reproductor expandido" aria-hidden="true">
      <div class="player-exp__bg" id="playerExpBg"></div>
      <button class="player-exp__close" id="playerExpClose" aria-label="Cerrar">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
      <div class="player-exp__body">
        <div class="player-exp__art-wrap">
          <img class="player-exp__art" id="playerExpArt" src="" alt="" />
        </div>
        <div class="player-exp__info">
          <p class="player-exp__title" id="playerExpTitle">Sin pista</p>
          <p class="player-exp__author" id="playerExpAuthor"></p>
        </div>
        <div class="player-exp__progress">
          <input
            class="player-exp__seek"
            id="playerExpSeek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Progreso"
          />
          <div class="player-exp__times">
            <span id="playerExpCurrent">0:00</span><span id="playerExpDuration">0:00</span>
          </div>
        </div>
        <div class="player-exp__btns">
          <button class="player-exp__btn" id="playerExpPrev" aria-label="Anterior">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20" />
              <line
                x1="5"
                y1="19"
                x2="5"
                y2="5"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
              />
            </svg>
          </button>
          <button
            class="player-exp__btn player-exp__btn--play"
            id="playerExpPlay"
            aria-label="Reproducir"
          >
            <svg id="iconExpPlay" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <svg
              id="iconExpPause"
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="display: none"
            >
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>
          <button class="player-exp__btn" id="playerExpNext" aria-label="Siguiente">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line
                x1="19"
                y1="5"
                x2="19"
                y2="19"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
              />
            </svg>
          </button>
        </div>
        <div class="player-exp__vol">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input
            class="player-exp__vol-range"
            id="playerExpVol"
            type="range"
            min="0"
            max="1"
            step="0.02"
            value="1"
            aria-label="Volumen"
          />
        </div>
      </div>
    </div>

    <!-- PROFILE PANEL -->
    <div class="profile-backdrop" id="profileBackdrop"></div>
    <aside class="profile-panel" id="profilePanel" aria-label="Perfil de usuario">
      <div class="profile-panel__head">
        <span class="profile-panel__title">Mi Perfil</span>
        <button class="profile-panel__close" id="profileClose" aria-label="Cerrar panel">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="profile-panel__body">
        <div>
          <div class="profile-avatar-lg">U</div>
          <p class="profile-name">Usuario</p>
          <p class="profile-sub">Plan gratuito · YouTube Data API v3</p>
        </div>
        <div class="quota-card">
          <p class="quota-card__label">Cuota API hoy</p>
          <div class="quota-bar-wrap">
            <div class="quota-bar-fill" id="quotaBarFill" style="width: 0%"></div>
          </div>
          <div class="quota-stats">
            <span><strong id="quotaUsed">-</strong> usadas</span>
            <span><strong id="quotaRemaining">-</strong> restantes</span>
          </div>
          <p class="quota-reset" id="quotaReset"></p>
        </div>
        <div class="quota-card">
          <p class="quota-card__label">Busquedas disponibles</p>
          <div class="quota-stats">
            <span>Hoy: <strong id="quotaSearches">-</strong> aprox.</span>
            <span id="quotaPercent" style="color: var(--muted)">0%</span>
          </div>
        </div>
      </div>
    </aside>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Third-party libs -->
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.9.0/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.css" />
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://unpkg.com/tippy.js@6/dist/tippy.umd.min.js"></script>
    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/library.js"></script>
    <script src="js/import.js"></script>
  </body>
</html>
