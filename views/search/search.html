<section aria-label="Buscar en YouTube">
  <p class="page-subtitle">
    Encuentra canciones y artistas. Agrégalos a tu biblioteca para descargarlos.
  </p>

  <div class="search-row">
    <div class="input-wrap">
      <svg
        class="input-wrap__icon"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        class="input"
        type="search"
        id="searchQuery"
        placeholder="Busca artistas, canciones, álbumes..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Búsqueda de YouTube"
      />
    </div>
    <button id="searchBtn" class="btn btn--primary">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      Buscar
    </button>
  </div>

  <div id="apiWarning" class="alert alert--warning" style="display: none">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <span id="apiWarningText"></span>
  </div>

  <div
    id="searchResults"
    class="results-grid"
    role="region"
    aria-label="Resultados de busqueda"
  ></div>
</section>
