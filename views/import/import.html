<section aria-label="Importar desde URL de YouTube">
  <p class="page-subtitle">
    Pega un enlace de YouTube para obtener una vista previa e importar a tu biblioteca.
  </p>

  <div id="apiImportWarning" class="alert alert--warning" style="display: none">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <span id="apiImportWarningText"></span>
  </div>

  <div class="search-row">
    <div class="input-wrap">
      <svg
        class="input-wrap__icon"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </svg>
      <input
        class="input"
        type="url"
        id="urlInput"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        spellcheck="false"
        aria-label="URL de YouTube"
      />
    </div>
    <button id="importBtn" class="btn btn--primary">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
      Cargar
    </button>
  </div>

  <!-- Preview card -->
  <div id="importCard" class="card">
    <div class="card__inner">
      <div class="card__thumb">
        <img id="importThumb" src="" alt="Miniatura del video" />
        <div class="card__thumb-overlay">
          <div class="play-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </div>
        </div>
      </div>
      <div class="card__body">
        <div>
          <div class="src-badges">
            <span class="src-badge src-badge--yt">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.4 5 12 5 12 5s-4.4 0-7 .1c-.4.1-1.3.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.6c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.7.8 1.7.8 2.1.8C6.4 19 12 19 12 19s4.4 0 7-.2c.4-.1 1.3-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"
                />
              </svg>
              YouTube
            </span>
          </div>
          <h2 class="card__title" id="importTitle">—</h2>
          <p class="card__author" id="importAuthor"></p>
        </div>
        <div class="action-row">
          <button id="importAddBtn" class="btn btn--primary">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Agregar a biblioteca
          </button>
          <a
            id="importYtBtn"
            class="btn btn--outline"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <polyline points="15 3 21 3 21 9" />
              <line x1="10" y1="14" x2="21" y2="3" />
            </svg>
            Ver en YouTube
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- History -->
  <section id="histSec" class="history" aria-label="Recientes">
    <div class="section-header">
      <span class="section-title">Recientes</span>
      <button class="btn--ghost danger" id="clearHistBtn">Limpiar</button>
    </div>
    <div id="histList" class="history__list"></div>
  </section>

  <div class="tip" role="note">
    <svg
      width="13"
      height="13"
      viewBox="0 0 24 24"
      fill="#f5c842"
      style="flex-shrink: 0"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" stroke="#0e0e12" stroke-width="2" />
      <line x1="12" y1="16" x2="12.01" y2="16" stroke="#0e0e12" stroke-width="2" />
    </svg>
    <span
      ><span class="tip__label">Tip:</span> Al detectar un enlace válido en el portapapeles, la
      vista previa se cargará automáticamente.</span
    >
  </div>
</section>
